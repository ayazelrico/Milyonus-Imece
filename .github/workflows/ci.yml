name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"
      - name: Pin Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --extra dev --extra admin --extra discord
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Format check
        run: uv run ruff format --check src tests evals
      - name: Test
        run: uv run pytest -q
      - name: Prepare isolated Python execution image
        run: |
          docker pull python:3.12-slim
          docker pull python@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e
      - name: Verify real Docker isolation and execution
        env:
          MILYONUS_TEST_DOCKER: "1"
        run: uv run pytest tests/test_imece_completion.py tests/test_imece_reduction.py tests/test_imece_cache_probe.py tests/test_imece_clean_revision.py -q -k real_docker
